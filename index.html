<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleepingForest Community Chest</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  :root {
    --bg: #0d0f14; --surface: #161922; --border: #2a2e3a;
    --text: #e8e9ed; --text-secondary: #9a9ea8; --text-muted: #6b6f7a;
    --accent: #7c8cf8;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0; padding: 3rem 4vw;
  }
  .wrap { max-width: 1600px; margin: 0 auto; }
  h1 { font-size: 32px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--text-secondary); font-size: 15px; margin: 0 0 32px; }
  .row { display: flex; gap: 10px; margin-bottom: 24px; }
  input[type=text] {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 13px 16px; border-radius: 10px; font-size: 16px;
  }
  button.reset {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 13px 22px; border-radius: 10px; cursor: pointer; font-size: 15px;
  }
  button.reset:hover { border-color: var(--accent); }
  .label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; }
  .pillrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .pill {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 8px 18px; border-radius: 10px; font-size: 15px; cursor: pointer;
  }
  .pill:hover { border-color: var(--accent); }
  .pill.active { background: rgba(124,140,248,.15); border-color: var(--accent); color: var(--accent); }
  .pill.small { font-size: 14px; padding: 6px 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; table-layout: auto; }
  thead th {
    text-align: left; padding: 14px 16px; color: var(--text-muted);
    border-bottom: 1px solid var(--border); font-weight: 500; font-size: 12px;
    text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
  }
  tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tablewrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: visible; }
  .itemname { display: flex; align-items: center; gap: 9px; font-weight: 500; font-size: 16px; white-space: nowrap; }
  .newbadge {
    font-size: 10px; font-weight: 600; background: var(--accent); color: #0d0f14;
    padding: 2px 7px; border-radius: 5px; letter-spacing: .03em; text-transform: uppercase;
    animation: pulse 2s ease-in-out infinite; flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .6; }
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .muted { color: var(--text-secondary); white-space: nowrap; }
  .affixlist { display: flex; flex-wrap: nowrap; gap: 6px; }
  .affix {
    font-size: 12px; background: var(--bg); padding: 4px 10px; border-radius: 7px;
    color: var(--text-secondary); white-space: nowrap; display: inline-block;
  }
  .status { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-secondary); white-space: nowrap; position: relative; }
  .status[data-tooltip] { cursor: help; }
  .status.show-tip::after {
    content: attr(data-tooltip);
    position: absolute; bottom: 130%; left: 0;
    background: #000; color: #fff; padding: 6px 10px; border-radius: 6px;
    font-size: 12px; white-space: nowrap; z-index: 10;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .status[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute; bottom: 130%; left: 0;
    background: #000; color: #fff; padding: 6px 10px; border-radius: 6px;
    font-size: 12px; white-space: nowrap; z-index: 10;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .empty { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 15px; }
  .loading { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 15px; }
  html, body { overflow-x: hidden; }
  @media (max-width: 768px) {
    body { padding: 1.5rem 1rem; }
    h1 { font-size: 24px; }
    .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { min-width: 760px; }
    .status[data-tooltip]:hover::after { left: auto; right: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>SleepingForest Community Chest</h1>
  <p class="sub">Browse donated gear. Use /additem in Discord to add your own.</p>

  <div class="row">
    <input type="text" id="search" placeholder="Search items...">
    <button class="reset" id="resetBtn">Reset</button>
  </div>

  <p class="label">Type</p>
  <div class="pillrow" id="types"></div>

  <div id="classWrap" style="display:none;">
    <p class="label">Class</p>
    <div class="pillrow" id="classes"></div>
  </div>

  <div id="toolCatWrap" style="display:none;">
    <p class="label">Category</p>
    <div class="pillrow" id="toolCats"></div>
  </div>

  <div id="detailWrap" style="display:none;">
    <div id="levelWrap" style="display:none;">
      <p class="label">Level</p>
      <div class="pillrow" id="levels"></div>
    </div>
    <div id="affixWrap" style="display:none;">
      <p class="label">Affixes (up to 4)</p>
      <div class="pillrow" id="affixes"></div>
    </div>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th style="width:24%">Item</th>
          <th style="width:14%">Category</th>
          <th style="width:14%">Class</th>
          <th style="width:13%">Added by</th>
          <th style="width:24%">Affixes</th>
          <th style="width:11%">Status</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="loading" class="loading">Loading chest...</div>
    <div id="empty" class="empty" style="display:none;">No items match those filters.</div>
  </div>
</div>

<script>
const ITEMS_URL = "https://raw.githubusercontent.com/darkblisss/sleepingforest-bot/main/items.json?cb=" + Date.now();

const RARITY_COLORS = {
  Uncommon: "#4ade80", Rare: "#60a5fa", Epic: "#c084fc",
  Legendary: "#fb923c", Mythic: "#f472b6"
};

const CLASS_LIST = ["Archmage","Spellblade","Sniper","Assassin","Guardian","Berserker"];

// Each Type maps to one or more real game "category" values.
// needsClass: true  -> pick a class first (item's real category depends on class, e.g. mage Bodyarmor = "Robe")
// needsClass: false -> category is fixed, skip straight to Level/Affixes
// isTools: true     -> pick one of the 6 tool categories first
const TYPE_CONFIG = {
  Helmet:    { needsClass: true, categories: ["Helmet","Hat"],
               classCategory: { Guardian:"Helmet", Berserker:"Helmet", Sniper:"Hat", Assassin:"Hat", Archmage:"Hat", Spellblade:"Hat" } },
  Bodyarmor: { needsClass: true, categories: ["Bodyarmor","Robe"],
               classCategory: { Guardian:"Bodyarmor", Berserker:"Bodyarmor", Sniper:"Bodyarmor", Assassin:"Bodyarmor", Archmage:"Robe", Spellblade:"Robe" } },
  Gloves:    { needsClass: true, categories: ["Gloves"],
               classCategory: { Guardian:"Gloves", Berserker:"Gloves", Sniper:"Gloves", Assassin:"Gloves", Archmage:"Gloves", Spellblade:"Gloves" } },
  Boots:     { needsClass: true, categories: ["Boots","Shoes"],
               classCategory: { Guardian:"Boots", Berserker:"Boots", Sniper:"Boots", Assassin:"Boots", Archmage:"Shoes", Spellblade:"Shoes" } },
  Sword:     { needsClass: false, categories: ["Sword"] },
  Shield:    { needsClass: false, categories: ["Shield"] },
  Bow:       { needsClass: false, categories: ["Bow"] },
  Staff:     { needsClass: false, categories: ["Staff"] },
  Ring:      { needsClass: false, categories: ["Ring"] },
  Amulet:    { needsClass: false, categories: ["Amulet"] },
  Tools:     { isTools: true, categories: ["Pickaxe","Axe","Pouch","Basket","Trap","Fishing Rod"] },
};
const TYPES = Object.keys(TYPE_CONFIG);

const affixPools = {
  Helmet: ["Max Health","Max Energy","Attack Power","Critical Chance","Critical Damage","Defense Penetration","Resource Efficiency","Damage Reflect","Health on Crit","Energy on Dodge"],
  Hat: ["Max Health","Max Energy","Attack Power","Critical Chance","Critical Damage","Defense Penetration","Resource Efficiency","Damage Reflect","Health on Crit","Energy on Dodge"],
  Bodyarmor: ["Max Health","Max Energy","Defense","Defense Penetration","Resource Efficiency","Damage Reflect","Dodge","Health on Hit","Health on Dodge","Energy on Hit"],
  Robe: ["Max Health","Max Energy","Defense","Defense Penetration","Resource Efficiency","Damage Reflect","Dodge","Health on Hit","Health on Dodge","Energy on Hit"],
  Gloves: ["Attack Power","Attack Speed","Critical Chance","Critical Damage","Defense Penetration","Resource Efficiency","Health on Hit","Health on Crit","Energy on Hit","Energy on Crit"],
  Boots: ["Max Health","Max Energy","Attack Speed","Defense","Health on Dodge","Health on Crit","Energy on Crit","Energy on Dodge","Dodge","Critical Damage"],
  Shoes: ["Max Health","Max Energy","Attack Speed","Defense","Health on Dodge","Health on Crit","Energy on Crit","Energy on Dodge","Dodge","Critical Damage"],
  Ring: ["Max Health","Max Energy","Attack Power","Defense","Critical Damage","Defense Penetration","Health on Hit","Health on Crit","Energy on Hit","Energy on Crit","Drop Chance","Gold Find"],
  Amulet: ["Max Health","Max Energy","Defense","Resource Efficiency","Damage Reflect","Perfect Block","Health on Dodge","Health on Block","Energy on Dodge","Energy on Block","Combat XP","Pet XP"],
  Shield: ["Max Health","Max Energy","Attack Power","Defense","Resource Efficiency","Damage Reflect","Block Chance","Perfect Block","Health on Block","Energy on Block"],
  Sword: ["Attack Power","Attack Speed","Critical Chance","Critical Damage","Defense Penetration","Resource Efficiency","Health on Hit","Health on Crit","Energy on Hit","Energy on Crit"],
  Staff: ["Attack Power","Attack Speed","Critical Chance","Critical Damage","Defense Penetration","Resource Efficiency","Health on Hit","Health on Crit","Energy on Hit","Energy on Crit"],
  Bow: ["Attack Power","Attack Speed","Critical Chance","Critical Damage","Defense Penetration","Resource Efficiency","Health on Hit","Health on Crit","Energy on Hit","Energy on Crit"]
};

const RARITY_ORDER = ["Uncommon","Rare","Epic","Legendary","Mythic"];

let items = [];
let selType = null, selClass = null, selToolCat = null, selLevel = null;
const selAffixes = new Set();

// Does item i belong to the current Type/Class/ToolCat selection? (level/affix not considered here)
function itemMatchesFilters(i) {
  if (!selType) return true;
  const cfg = TYPE_CONFIG[selType];
  if (cfg.isTools) {
    if (!cfg.categories.includes(i.category)) return false;
    if (selToolCat && i.category !== selToolCat) return false;
    return true;
  }
  if (cfg.needsClass) {
    if (!cfg.categories.includes(i.category)) return false;
    if (selClass) {
      if (i.category !== cfg.classCategory[selClass]) return false;
      if (!(i.classes || []).includes(selClass)) return false;
    }
    return true;
  }
  return cfg.categories.includes(i.category);
}

// The single real "category" value once fully resolved, or null if not yet resolved
function resolvedCategory() {
  if (!selType) return null;
  const cfg = TYPE_CONFIG[selType];
  if (cfg.isTools) return selToolCat;
  if (cfg.needsClass) return selClass ? cfg.classCategory[selClass] : null;
  return cfg.categories[0];
}

const typeEl = document.getElementById('types');
TYPES.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'pill';
  btn.textContent = t;
  btn.onclick = () => {
    selType = selType === t ? null : t;
    selClass = null; selToolCat = null; selLevel = null; selAffixes.clear();
    [...typeEl.children].forEach(b => b.classList.remove('active'));
    if (selType) btn.classList.add('active');
    buildClassWrap(); buildToolCatWrap(); buildLevels(); buildAffixes(); render();
  };
  typeEl.appendChild(btn);
});

function buildClassWrap() {
  const wrap = document.getElementById('classWrap');
  const classEl = document.getElementById('classes');
  classEl.innerHTML = '';
  const cfg = selType ? TYPE_CONFIG[selType] : null;
  if (!cfg || !cfg.needsClass) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  CLASS_LIST.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'pill small';
    btn.textContent = c;
    btn.onclick = () => {
      selClass = selClass === c ? null : c;
      selLevel = null; selAffixes.clear();
      [...classEl.children].forEach(b => b.classList.remove('active'));
      if (selClass) btn.classList.add('active');
      buildLevels(); buildAffixes(); render();
    };
    classEl.appendChild(btn);
  });
}

function buildToolCatWrap() {
  const wrap = document.getElementById('toolCatWrap');
  const tcEl = document.getElementById('toolCats');
  tcEl.innerHTML = '';
  const cfg = selType ? TYPE_CONFIG[selType] : null;
  if (!cfg || !cfg.isTools) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  cfg.categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'pill small';
    btn.textContent = cat;
    btn.onclick = () => {
      selToolCat = selToolCat === cat ? null : cat;
      selLevel = null; selAffixes.clear();
      [...tcEl.children].forEach(b => b.classList.remove('active'));
      if (selToolCat) btn.classList.add('active');
      buildLevels(); buildAffixes(); render();
    };
    tcEl.appendChild(btn);
  });
}


// Turns "Copper Helmet" + category "Helmet" into tier label "Copper"
function tierLabel(name, cat) {
  const suffix = ' ' + cat;
  return name.endsWith(suffix) ? name.slice(0, -suffix.length) : name;
}

function updateDetailWrapVisibility() {
  const detailWrap = document.getElementById('detailWrap');
  const levelWrap = document.getElementById('levelWrap');
  const affixWrap = document.getElementById('affixWrap');
  const showDetail = levelWrap.style.display !== 'none' || affixWrap.style.display !== 'none';
  detailWrap.style.display = showDetail ? 'block' : 'none';
}

function buildLevels() {
  const wrap = document.getElementById('levelWrap');
  const levelEl = document.getElementById('levels');
  levelEl.innerHTML = '';
  const cat = resolvedCategory();
  if (!cat) { wrap.style.display = 'none'; updateDetailWrapVisibility(); return; }
  const seen = new Map();
  items.filter(itemMatchesFilters).forEach(i => {
    if (!seen.has(i.level)) seen.set(i.level, tierLabel(i.name, cat));
  });
  const tiers = [...seen.entries()].sort((a, b) => b[0] - a[0]);
  if (tiers.length < 2) { wrap.style.display = 'none'; updateDetailWrapVisibility(); return; }
  wrap.style.display = 'block';
  tiers.forEach(([lvl, label]) => {
    const btn = document.createElement('button');
    btn.className = 'pill small';
    btn.textContent = label;
    btn.onclick = () => {
      selLevel = selLevel === lvl ? null : lvl;
      [...levelEl.children].forEach(b => b.classList.remove('active'));
      if (selLevel !== null) btn.classList.add('active');
      render();
    };
    levelEl.appendChild(btn);
  });
  updateDetailWrapVisibility();
}

function buildAffixes() {
  const wrap = document.getElementById('affixWrap');
  const affixEl = document.getElementById('affixes');
  affixEl.innerHTML = '';
  const cat = resolvedCategory();
  const pool = affixPools[cat] || [];
  if (!cat || pool.length === 0) { wrap.style.display = 'none'; updateDetailWrapVisibility(); return; }
  wrap.style.display = 'block';
  pool.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'pill small';
    btn.textContent = a;
    btn.onclick = () => {
      if (selAffixes.has(a)) { selAffixes.delete(a); btn.classList.remove('active'); }
      else if (selAffixes.size < 4) { selAffixes.add(a); btn.classList.add('active'); }
      render();
    };
    affixEl.appendChild(btn);
  });
  updateDetailWrapVisibility();
}

document.getElementById('resetBtn').onclick = () => {
  selType = null; selClass = null; selToolCat = null; selLevel = null; selAffixes.clear();
  document.getElementById('search').value = '';
  [...typeEl.children].forEach(b => b.classList.remove('active'));
  buildClassWrap(); buildToolCatWrap(); buildLevels(); buildAffixes(); render();
};
document.getElementById('search').addEventListener('input', render);

function abbreviateClasses(classes) {
  if (!classes || !classes.length) return '';
  if (classes.includes('All')) return 'All';
  const groups = [
    { label: 'Mage', members: ['Archmage','Spellblade'] },
    { label: 'Warrior', members: ['Guardian','Berserker'] },
    { label: 'Ranger', members: ['Sniper','Assassin'] },
  ];
  let remaining = [...classes];
  const output = [];
  groups.forEach(g => {
    if (g.members.every(m => remaining.includes(m))) {
      output.push(g.label);
      remaining = remaining.filter(c => !g.members.includes(c));
    }
  });
  classes.forEach(c => {
    if (remaining.includes(c)) { output.push(c); remaining = remaining.filter(x => x !== c); }
  });
  return output.join(', ');
}

function isItemNew(i) {
  return !!(i.added_at && (Date.now() - new Date(i.added_at).getTime()) < 24 * 60 * 60 * 1000);
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = items.filter(i =>
    i.name.toLowerCase().includes(q) &&
    itemMatchesFilters(i) &&
    (selLevel === null || i.level === selLevel) &&
    [...selAffixes].every(a => (i.affixes || []).includes(a))
  ).sort((a, b) => {
    const aNew = isItemNew(a), bNew = isItemNew(b);
    if (aNew !== bNew) return aNew ? -1 : 1;
    const aRented = a.status === 'rented', bRented = b.status === 'rented';
    if (aRented !== bRented) return aRented ? 1 : -1;
    const aLevel = a.level || 0, bLevel = b.level || 0;
    if (aLevel !== bLevel) return bLevel - aLevel;
    const aRarity = RARITY_ORDER.indexOf(a.rarity), bRarity = RARITY_ORDER.indexOf(b.rarity);
    return bRarity - aRarity;
  });
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';
  filtered.forEach(i => {
    const rarityColor = RARITY_COLORS[i.rarity] || '#9a9ea8';
    const isNew = isItemNew(i);
    const statusColor = i.status === 'available' ? '#4ade80' : '#f87171';
    const statusLabel = i.status ? i.status.charAt(0).toUpperCase() + i.status.slice(1) : 'Unknown';
    let statusTitle = '';
    if (i.status === 'rented' && i.borrower_name) {
      const d = i.borrowed_at ? new Date(i.borrowed_at).toLocaleDateString() : '';
      statusTitle = `Rented to ${i.borrower_name}${d ? ' on ' + d : ''}`;
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="itemname" style="color:${rarityColor}">${i.name}${isNew ? '<span class="newbadge">New</span>' : ''}</span></td>
      <td class="muted">${i.category || ''}</td>
      <td class="muted">${abbreviateClasses(i.classes)}</td>
      <td class="muted">${i.owner_name || ''}</td>
      <td><div class="affixlist">${(i.affixes || []).map(a => `<span class="affix">${a}</span>`).join('')}</div></td>
      <td><span class="status" ${statusTitle ? `data-tooltip="${statusTitle}"` : ''}><span class="dot" style="background:${statusColor}"></span>${statusLabel}</span></td>
    `;
    if (statusTitle) {
      const statusEl = tr.querySelector('.status');
      statusEl.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = statusEl.classList.contains('show-tip');
        document.querySelectorAll('.status.show-tip').forEach(el => el.classList.remove('show-tip'));
        if (!wasOpen) statusEl.classList.add('show-tip');
      });
    }
    rows.appendChild(tr);
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.status.show-tip').forEach(el => el.classList.remove('show-tip'));
});

fetch(ITEMS_URL)
  .then(r => {
    if (!r.ok) throw new Error('items.json not found yet - add your first item with /additem');
    return r.json();
  })
  .then(data => {
    items = data;
    document.getElementById('loading').style.display = 'none';
    render();
  })
  .catch(err => {
    document.getElementById('loading').textContent = err.message;
  });
</script>
</body>
</html>
