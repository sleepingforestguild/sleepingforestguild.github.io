<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleepingForest Chest — Pending Requests</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="shortcut icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="favicon.png?v=3">
<style>
  :root {
    --bg: #0d0f14; --surface: #161922; --border: #2a2e3a;
    --text: #e8e9ed; --text-secondary: #9a9ea8; --text-muted: #6b6f7a;
    --accent: #7c8cf8;
    --rarity-common: #d1d5db; --rarity-uncommon: #4ade80; --rarity-rare: #60a5fa;
    --rarity-epic: #c084fc; --rarity-legendary: #fb923c; --rarity-mythic: #f472b6;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0; padding: 3rem 4vw;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 32px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--text-secondary); font-size: 15px; margin: 0; }
  .back-link { color: var(--text-muted); font-size: 13px; text-decoration: underline; }
  .back-link:hover { color: var(--text); }

  .authbox { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .authbox img { width: 32px; height: 32px; border-radius: 50%; }
  .authbox .uname { font-size: 14px; color: var(--text); }
  .btn-discord {
    background: #5865F2; border: none; color: #fff; padding: 10px 18px;
    border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-discord:hover { background: #4752c4; }
  .link-muted { color: var(--text-muted); font-size: 13px; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 8px 4px; font-family: inherit; }

  .state-message {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 40px; text-align: center; color: var(--text-secondary); font-size: 15px;
  }
  .notice { color: #fbbf24; font-size: 13px; margin: -16px 0 16px; display: none; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px; margin-bottom: 14px; display: flex; gap: 18px; align-items: flex-start;
  }
  .card-icon {
    width: 48px; height: 48px; border-radius: 8px; border: 1px solid var(--border);
    object-fit: contain; background: var(--bg); padding: 4px; flex-shrink: 0;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card-title { font-weight: 600; font-size: 16px; }
  .card-kind {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: 3px 9px; border-radius: 6px; flex-shrink: 0;
  }
  .card-kind.borrow { background: rgba(124,140,248,.15); color: var(--accent); }
  .card-kind.return { background: rgba(74,222,128,.15); color: #4ade80; }
  .card-line { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }
  .card-time { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
  .card-time.stale-warning { color: #fb923c; }
  .card-time.stale-critical { color: #f87171; font-weight: 700; }
  .card-affixes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .card-affix {
    font-size: 11px; background: var(--bg); padding: 3px 8px; border-radius: 6px;
    color: var(--text-secondary);
  }
  .card-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid transparent; min-height: 36px;
  }
  .btn-approve { background: rgba(74,222,128,.15); border-color: #4ade80; color: #4ade80; }
  .btn-approve:hover { background: rgba(74,222,128,.28); }
  .btn-deny { background: rgba(248,113,113,.12); border-color: #f87171; color: #f87171; }
  .btn-deny:hover { background: rgba(248,113,113,.25); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; max-width: 340px; background: var(--surface);
    border: 1px solid var(--border); border-left: 3px solid var(--accent); color: var(--text);
    padding: 14px 18px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    z-index: 2000; opacity: 0; transform: translateY(12px); pointer-events: none; cursor: pointer;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .toast.error { border-left-color: #f87171; }

  @media (max-width: 600px) {
    body { padding: 1.5rem 1rem; }
    .topbar { flex-direction: column; }
    .card { flex-direction: column; }
    .btn { min-height: 40px; flex: 1; }
    .toast { left: 16px; right: 16px; bottom: 16px; max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Pending Requests</h1>
      <p class="sub">Approve or deny borrow/return requests directly - useful if a Discord DM went missing.</p>
      <p class="sub"><a class="back-link" href="index.html">&larr; Back to the chest</a></p>
    </div>
    <div class="authbox" id="authBox"></div>
  </div>
  <p class="notice" id="notice"></p>

  <div id="content">
    <div class="state-message" id="loadingMsg">Loading...</div>
  </div>
</div>

<div class="toast" id="toastEl" role="alert" aria-live="assertive"></div>

<script>
const API_BASE = "https://sleepingforest-bot.onrender.com";
const SERVER_DOWN = "Can't reach the chest server. It may be waking up - try again in a minute.";
const POLL_MS = 10000;
const PLACEHOLDER_ICON = "data:image/svg+xml;utf8," + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><rect width='60' height='60' rx='8' fill='#161922'/><path d='M20 40 L30 20 L40 40 Z' fill='#2a2e3a'/></svg>"
);
const $ = (id) => document.getElementById(id);

// Browser storage can throw (Safari with cookies blocked): the page must work without it.
function getToken() { try { return localStorage.getItem('sf_token'); } catch { return null; } }
function clearToken() { try { localStorage.removeItem('sf_token'); } catch {} }

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

const toastEl = $('toastEl');
let toastTimeout = null;
function showToast(message, isError = false) {
  clearTimeout(toastTimeout);
  toastEl.textContent = message;
  toastEl.classList.toggle('error', isError);
  toastEl.classList.add('show');
  toastTimeout = setTimeout(() => { toastEl.classList.remove('show'); }, 6000);
}
toastEl.addEventListener('click', () => {
  clearTimeout(toastTimeout);
  toastEl.classList.remove('show');
});

class ApiError extends Error {
  constructor(message, status) { super(message); this.status = status; }
}
// Whatever goes wrong, the officer gets a sentence, never "Failed to fetch" or a JSON error.
async function apiFetch(path, { method = 'GET', body } = {}) {
  const headers = {};
  const token = getToken();
  if (token) headers.Authorization = `Bearer ${token}`;
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  let r;
  try {
    r = await fetch(API_BASE + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  } catch {
    throw new ApiError(SERVER_DOWN, 0);
  }
  let data = null;
  try { data = await r.json(); } catch {}
  if (r.ok && data) return data;
  if (r.ok) throw new ApiError(SERVER_DOWN, r.status);
  const message = data && typeof data.error === 'string' ? data.error
    : (r.status >= 500 ? 'The chest server had a problem. Try again in a minute.' : 'Something went wrong.');
  throw new ApiError(message, r.status);
}

function showState(text) {
  const content = $('content');
  content.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'state-message';
  box.textContent = text;
  content.appendChild(box);
}
function showNotice(text) {
  $('notice').textContent = text;
  $('notice').style.display = text ? 'block' : 'none';
}

let currentUser = null;

function renderAuthBox() {
  const box = $('authBox');
  if (currentUser) {
    const avatarUrl = currentUser.avatar
      ? `https://cdn.discordapp.com/avatars/${encodeURIComponent(currentUser.id)}/${encodeURIComponent(currentUser.avatar)}.png?size=64`
      : 'https://cdn.discordapp.com/embed/avatars/0.png';
    const displayName = currentUser.ingame_name || currentUser.username;
    box.innerHTML = `<img src="${avatarUrl}" alt=""><span class="uname">${escapeHtml(displayName)}</span><button class="link-muted" id="logoutBtn" type="button">Log out</button>`;
    $('logoutBtn').onclick = () => { clearToken(); window.location.reload(); };
  } else {
    box.innerHTML = `<button class="btn-discord" id="loginBtn" type="button">Log in with Discord</button>`;
    $('loginBtn').onclick = () => { window.location.href = `${API_BASE}/auth/discord/login`; };
  }
}

function timeAgoInfo(iso, expiresIso) {
  if (!iso) return { text: '', className: '' };
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.max(0, Math.floor(diffMs / 60000));
  const hours = Math.floor(mins / 60);
  const days = Math.floor(hours / 24);
  let text;
  if (mins < 1) text = 'just now';
  else if (mins < 60) text = `${mins}m ago`;
  else if (hours < 24) text = `${hours}h ago`;
  else text = `${days}d ago`;
  let className = '';
  if (days >= 5) className = 'stale-critical';
  else if (hours >= 48) className = 'stale-warning';
  let expires = '';
  if (expiresIso) {
    const left = new Date(expiresIso).getTime() - Date.now();
    const leftHours = Math.max(0, Math.round(left / 3600000));
    expires = leftHours >= 48 ? ` · expires in ${Math.round(leftHours / 24)} days` : ` · expires in ${leftHours}h`;
  }
  return { text: `Requested ${text}${expires}`, className };
}

// Polling: fetch quietly, compare with the last list, and only rebuild when something changed,
// so the Approve button never moves under someone's finger. The "Requested 5m ago" lines are
// refreshed on every poll. Requests being answered right now keep their buttons disabled.
let currentPending = [];
let lastPendingJSON = null;
let pollTimer = null;
const inFlight = new Set();

function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => pollPending(false), POLL_MS);
}
function stopPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}

async function pollPending(isFirstLoad) {
  try {
    const data = await apiFetch('/api/pending');
    showNotice('');
    const json = JSON.stringify(data.pending);
    if (json !== lastPendingJSON) {
      lastPendingJSON = json;
      currentPending = data.pending;
      renderPending();
    } else {
      refreshTimes();
    }
  } catch (err) {
    if (err.status === 401 || err.status === 403) {  // login expired or not an officer any more: stop asking
      stopPolling();
      if (err.status === 401) clearToken();
      currentUser = null;
      renderAuthBox();
      showState(err.status === 401 ? 'Your login expired. Log in with Discord again.' : 'Officers only.');
      return false;
    }
    if (isFirstLoad) showState(err.message);
    else showNotice(`${err.message} Showing the list from ${new Date(lastFetchOk || Date.now()).toLocaleTimeString()}.`);
    return;
  }
  lastFetchOk = Date.now();
}
let lastFetchOk = 0;

function refreshTimes() {
  document.querySelectorAll('.card[data-id]').forEach(card => {
    const p = currentPending.find(x => x.id === card.dataset.id);
    if (!p) return;
    const info = timeAgoInfo(p.created_at, p.expires_at);
    const el = card.querySelector('.card-time');
    el.textContent = info.text;
    el.className = 'card-time ' + info.className;
  });
}

function renderPending() {
  const content = $('content');
  const visible = currentPending;
  if (!visible.length) {
    showState('Nothing pending right now.');
    return;
  }
  content.innerHTML = '';
  visible.forEach(p => {
    const timeInfo = timeAgoInfo(p.created_at, p.expires_at);
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = p.id;
    const kind = p.type === 'borrow' ? 'borrow' : 'return';
    const rarity = (p.item_rarity || '').toLowerCase().replace(/[^a-z]/g, '');
    card.innerHTML = `
      <img class="card-icon" alt="">
      <div class="card-body">
        <div class="card-top">
          <span class="card-title" style="color:var(--rarity-${rarity}, #9a9ea8)">${escapeHtml(p.item_name)}</span>
          <span class="card-kind ${kind}">${kind === 'borrow' ? 'Borrow' : 'Return'}</span>
        </div>
        <div class="card-line">${escapeHtml(p.requester_name)} &rarr; owner ${escapeHtml(p.owner_name || '?')}</div>
        <div class="card-time ${timeInfo.className}">${escapeHtml(timeInfo.text)}</div>
        <div class="card-affixes">${(p.item_affixes || []).map(a => `<span class="card-affix">${escapeHtml(a)}</span>`).join('')}</div>
        <div class="card-actions">
          <button class="btn btn-approve" type="button" data-approved="true">Approve</button>
          <button class="btn btn-deny" type="button" data-approved="false">Deny</button>
        </div>
      </div>
    `;
    // Set in code, not as an inline onerror attribute: the placeholder's quotes broke that one.
    const img = card.querySelector('.card-icon');
    img.onerror = function () { this.onerror = null; this.src = PLACEHOLDER_ICON; };
    img.src = p.item_icon_url || PLACEHOLDER_ICON;
    card.querySelectorAll('.btn').forEach(btn => {
      btn.disabled = inFlight.has(p.id);
      btn.addEventListener('click', () => resolveRequest(p.id, btn.dataset.approved === 'true'));
    });
    content.appendChild(card);
  });
}

async function resolveRequest(id, approved) {
  if (inFlight.has(id)) return;
  inFlight.add(id);
  const cardNow = () => document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  const setButtons = (disabled, label) => {
    const card = cardNow();
    if (!card) return;
    card.querySelectorAll('.btn').forEach(b => { b.disabled = disabled; });
    const btn = card.querySelector(`.btn[data-approved="${approved}"]`);
    if (btn) btn.textContent = label;
  };
  setButtons(true, approved ? 'Approving...' : 'Denying...');
  try {
    await apiFetch(`/api/pending/${encodeURIComponent(id)}/resolve`, { method: 'POST', body: { approved } });
    showToast(approved ? 'Request approved.' : 'Request denied.');
    currentPending = currentPending.filter(p => p.id !== id);
    lastPendingJSON = JSON.stringify(currentPending);
    inFlight.delete(id);
    const card = cardNow();  // looked up now: a poll may have rebuilt the list meanwhile
    if (card) card.remove();
    if (!document.querySelector('.card')) showState('Nothing pending right now.');
  } catch (err) {
    inFlight.delete(id);
    showToast(err.message, true);
    setButtons(false, approved ? 'Approve' : 'Deny');
    if (err.status === 400) pollPending(false);  // already answered elsewhere: refresh the list
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopPolling();
  } else if (currentUser && currentUser.officer) {
    pollPending(false);
    startPolling();
  }
});

window.addEventListener('pageshow', (event) => {
  if (event.persisted) window.location.reload();
});

async function loadUser() {
  if (!getToken()) return null;
  try {
    return await apiFetch('/api/me');
  } catch (err) {
    if (err.status === 401) { clearToken(); return null; }
    throw err;
  }
}

(async function init() {
  try {
    currentUser = await loadUser();
  } catch (err) {
    renderAuthBox();
    showState(err.message);
    setTimeout(() => window.location.reload(), 30000);  // the bot may be restarting: try again shortly
    return;
  }
  renderAuthBox();
  if (!currentUser) {
    showState('Log in with Discord to view pending requests.');
    return;
  }
  if (!currentUser.officer) {
    showState('Officers only.');
    return;
  }
  if (await pollPending(true) !== false) startPolling();
})();
</script>
</body>
</html>
